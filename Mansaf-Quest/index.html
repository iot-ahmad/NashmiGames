    <div class="stat-card"><div class="stat-val" id="statRice">4/4</div><div class="stat-label">رز</div></div>
    <div class="stat-card"><div class="stat-val" id="statLaban">4/4</div><div class="stat-label">لبن</div></div>
  </div>

<!-- Particle overlay canvas -->

<div id="mobileControls">
  <button class="mBtn" id="btnLeft" aria-label="يسار">◀</button>
  <button class="mBtn" id="btnJump" aria-label="قفز">▲</button>

<script>
// ===== STARFIELD GENERATOR =====
function spawnStars(containerId, count = 60) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --dur:${2 + Math.random() * 4}s;
      --min-op:${0.1 + Math.random()*0.3};
      animation-delay:${Math.random()*4}s;
    `;
    container.appendChild(s);
  }
}
spawnStars('starfield', 80);
spawnStars('starfieldGO', 50);
spawnStars('starfieldWin', 50);

// ===== PARTICLE SYSTEM =====
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeParticleCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
resizeParticleCanvas();
window.addEventListener('resize', resizeParticleCanvas);

function spawnParticles(wx, wy, color) {
  // wx, wy = world-to-screen position
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 120;
    particles.push({
      x: wx, y: wy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 60,
      life: 1.0,
      decay: 0.9 + Math.random() * 0.6,
      size: 3 + Math.random() * 4,
      color: color || '#ffd700'
    });
  }
}

let lastPTime = 0;
function animParticles(ts) {
  const dt = Math.min((ts - lastPTime) / 1000, 0.05);
  lastPTime = ts;
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 250 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    pCtx.globalAlpha = p.life;
    pCtx.fillStyle = p.color;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  requestAnimationFrame(animParticles);
}
requestAnimationFrame(animParticles);

// Helper: world coords -> screen coords
function worldToScreen(wx, wy) {
  const wrap = document.getElementById('gameWrap');
  const rect = wrap.getBoundingClientRect();
  const scaleX = rect.width / 800;
  const scaleY = rect.height / 600;
  return {
    x: rect.left + (wx) * scaleX,
    y: rect.top  + (wy) * scaleY
  };
}


const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameWrap = document.getElementById('gameWrap');
const hudEl = document.getElementById('hud');

function resize(){
  const s = Math.min(window.innerWidth/800, window.innerHeight/600, 1);
  canvas.width = 800; canvas.height = 600;
  gameWrap.style.width = (800*s)+'px';
  gameWrap.style.height = (600*s)+'px';
  canvas.style.width = '100%';
  canvas.style.height = '100%';
}
resize(); window.addEventListener('resize', resize);

function initHudIcons(){
  const falafelIcon = document.getElementById('hudFalafelIcon');
  falafelIcon.getContext('2d').drawImage(Assets.icons.falafel, 0, 0, 16, 16);

  const livesEl = document.getElementById('hudLives');
  for(let i=0;i<3;i++){
    const c = document.createElement('canvas');
    c.className = 'hud-icon';
    c.width = 16; c.height = 16;
    livesEl.appendChild(c);
  }

  const ingEl = document.getElementById('hudIngredients');
  for(const k of ['Jameed','Meat','Rice','Laban']){
    const span = document.createElement('span');
    span.dataset.ing = k;
    span.textContent = `${INGREDIENT_NAMES[k]}: 0/4`;
    ingEl.appendChild(span);
  }
}
initHudIcons();

// ========== GAME STATE ==========
let GS = {};
function resetGS(){
  GS = {
    lives:3, falafelCount:0, level:1, running:false,
    ingredients:{Jameed:0, Meat:0, Rice:0, Laban:0},
    starvingTriggered:false, bubbleAlpha:0, bubbleDir:1
  };
}
resetGS();

const INGREDIENT_MAP = ['Jameed','Jameed','Jameed','Jameed','Meat','Meat','Meat','Meat','Rice','Rice','Rice','Rice','Laban','Laban','Laban','Laban'];
const INGREDIENT_COLORS = {Jameed:'#c8b560',Meat:'#d4513a',Rice:'#f5f5dc',Laban:'#e8e8e8'};
const INGREDIENT_NAMES = {Jameed:'جميد',Meat:'لحمة',Rice:'رز',Laban:'لبن'};
const BG_COLORS = ['#2c3e6b','#2c3e6b','#2c3e6b','#2c3e6b','#4a3728','#4a3728','#4a3728','#4a3728','#8b4513','#8b4513','#8b4513','#8b4513','#654321','#654321','#654321','#654321'];

// ========== LEVEL DATA ==========
let player, platforms, falafels, obstacles, majorItem, door, camera, lavaPits, lasers;
let invulnTimer = 0;

function buildLevel(){
  camera = {x:0};
  const W = 3200, G = 570;

  player = {x:60,y:G-48,w:32,h:44,vx:0,vy:0,onGround:false,facing:1,frame:0,frameT:0};

  // Ground is solid, some floating platforms move
  platforms = [{x:0,y:G,w:W,h:30,passThru:false,moving:false,vx:0,originX:0}];
  for(let i=0;i<12;i++){
    const px=200+i*250, isMoving=(i%3===0); // only every 3rd platform moves
    const spd=isMoving?(20+Math.random()*40):0;
    // Lowered platform height to be reachable by the player
    platforms.push({x:px,y:G-60-Math.random()*80,w:100+Math.random()*60,h:16,passThru:false,moving:isMoving,vx:spd*(i%2===0?1:-1),originX:px,range:60+Math.random()*60});
  }

  // Lava pits (gaps in ground)
  lavaPits = [];
  const pitCount = 1 + Math.floor(GS.level/3);
  for(let i=0;i<pitCount;i++){
    const px = 500 + i * 600 + Math.random()*200;
    lavaPits.push({x:px, w:80+Math.random()*40, bubbles:[]});
    // Init lava bubbles
    for(let b=0;b<5;b++){
      lavaPits[i].bubbles.push({rx:Math.random(), ry:Math.random(), s:2+Math.random()*3, sp:0.5+Math.random()});
    }
  }

  // Falafels: 10 in even levels, 12 in odd levels. Half on ground, half on platforms
  falafels = [];
  const totalFalafel = GS.level % 2 === 0 ? 10 : 12;
  const onGround = Math.floor(totalFalafel / 2);
  const onPlat = totalFalafel - onGround;
  const G2 = 570;
  // Ground falafels - spread across the level
  for(let i=0;i<onGround;i++){
    let fx = 150+i*(2800/onGround)+Math.random()*80;
    // Check if it's inside a lava pit, if so, move it
    for(const pit of lavaPits) {
      if(fx > pit.x - 20 && fx < pit.x + pit.w + 20) {
        fx = pit.x - 30; // Move before the pit
      }
    }
    falafels.push({x:fx, y:G2-25, w:16, h:16, alive:true});
  }
  // Platform falafels
  for(let i=0;i<onPlat;i++){
    let px = platforms[1+i%(platforms.length-1)];
    falafels.push({x:px.x+px.w/2+Math.random()*30-15, y:px.y-25, w:16, h:16, alive:true});
  }

  // Enemies (some shoot lasers)
  obstacles = []; lasers = [];
  const obsCount = 2 + Math.min(GS.level, 6);
  for(let i=0;i<obsCount;i++){
    const shoots = i % 2 === 0; // every other enemy shoots
    obstacles.push({
      x:400+i*(3200/(obsCount+1)), y:570-30, w:30, h:30,
      vx:(Math.random()>0.5?1:-1)*(1+GS.level*0.3), type:Math.floor(Math.random()*3),
      alive:true, shoots:shoots, shootTimer:4+Math.random()*1.5
    });
  }

  majorItem = {x:2800, y:570-60, w:32, h:32, alive:true, visible:false};
  door = {x:3100, y:570-70, w:50, h:70};
}

// ========== INPUT ==========
const keys = {};
window.addEventListener('keydown', e=>{keys[e.code]=true; e.preventDefault()});
window.addEventListener('keyup', e=>{keys[e.code]=false});

// Mobile
const mL=document.getElementById('btnLeft'), mR=document.getElementById('btnRight'), mJ=document.getElementById('btnJump');
let mLeft=false,mRight=false,mJump=false;
function mTouch(el,key,cb){
  el.addEventListener('touchstart',e=>{e.preventDefault();cb(true)},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();cb(false)},{passive:false});
}
mTouch(mL,'l',v=>mLeft=v); mTouch(mR,'r',v=>mRight=v); mTouch(mJ,'j',v=>mJump=v);

// ========== DRAW HELPERS ==========
function drawTilesRect(x, y, w, h, tile, isPlatform){
  const ts = 16;
  if(isPlatform){
    Assets.drawTile(ctx, tile, x, y, w, h);
    return;
  }
  Assets.drawTile(ctx, Assets.tiles.ground, x, y, w, Math.min(h, ts));
  if(h > ts) Assets.drawTile(ctx, Assets.tiles.ground, x, y + ts, w, h - ts);
}

function drawFalafel(x,y){
  ctx.drawImage(Assets.falafel, x, y, 16, 16);
}

function drawIngredient(x,y,type){
  ctx.drawImage(Assets.ingredients[type], x, y, 32, 32);
  ctx.fillStyle='#000'; ctx.font='10px Cairo';
  ctx.textAlign='center';
  ctx.fillText(INGREDIENT_NAMES[type],x+16,y+28);
}

function drawObstacle(o){
  if(!o.alive)return;
  ctx.drawImage(Assets.enemies[o.type], o.x-camera.x, o.y, o.w, o.h);
  if(o.shoots){
    ctx.fillStyle='#f00';
    ctx.fillRect(o.x-camera.x+12,o.y-4,6,4);
  }
}

function drawLaser(l){
  ctx.fillStyle='rgba(255,0,0,0.9)';
  ctx.fillRect(l.x-camera.x,l.y,l.w,l.h);
  ctx.fillStyle='rgba(255,100,100,0.6)';
  ctx.fillRect(l.x-camera.x,l.y+1,l.w,l.h-2);
}

function drawLavaPit(pit){
  const px=pit.x-camera.x, G=570;
  Assets.drawTile(ctx, Assets.tiles.lava, px, G, pit.w, 30);
  for(const b of pit.bubbles){
    ctx.fillStyle='rgba(255,200,0,0.7)';
    ctx.beginPath();
    ctx.arc(px+b.rx*pit.w, G+5+b.ry*15, b.s, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle='rgba(255,69,0,0.15)';
  ctx.fillRect(px-5,G-20,pit.w+10,20);
}

// ========== GAME LOGIC ==========
function updatePlayer(dt){
  // Super Mario physics
  const spd=300, jmp=-750, grav=1800;

  // Input
  if(keys['ArrowLeft']||keys['KeyA']||mLeft){player.vx=-spd;player.facing=-1;}
  else if(keys['ArrowRight']||keys['KeyD']||mRight){player.vx=spd;player.facing=1;}
  else player.vx=0;

  if((keys['ArrowUp']||keys['KeyW']||keys['Space']||mJump)&&player.onGround){
    player.vy=jmp; player.onGround=false;
  } else if (!(keys['ArrowUp']||keys['KeyW']||keys['Space']||mJump) && player.vy < -300) {
    // Variable jump height (release button early to cut jump short)
    player.vy = -300;
  }

  player.vy+=grav*dt;

  // Move X first, then resolve X collisions
  player.x+=player.vx*dt;
  for(const p of platforms){
    if(player.x+player.w>p.x && player.x<p.x+p.w &&
       player.y+player.h>p.y+2 && player.y<p.y+p.h-2){
      if(player.vx>0) player.x=p.x-player.w;
      else if(player.vx<0) player.x=p.x+p.w;
      player.vx=0;
    }
  }

  // Move Y, then resolve Y collisions
  player.y+=player.vy*dt;
  player.onGround=false;
  for(const p of platforms){
    if(player.x+player.w>p.x && player.x<p.x+p.w &&
       player.y+player.h>p.y && player.y<p.y+p.h){
      if(player.vy>0){
        // Landing on top
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
      } else if(player.vy<0){
        // Hitting from below
        player.y=p.y+p.h;
        player.vy=0;
      }
    }
  }

  // Lava pit collision
  for(const pit of lavaPits){
    if(player.x+player.w>pit.x && player.x<pit.x+pit.w && player.y+player.h>568){
      loseLife(); invulnTimer=1.5;
      player.x=Math.max(60,pit.x-60); player.y=400; player.vy=-400;
    }
  }

  // Boundaries
  if(player.x<0)player.x=0;
  if(player.y>600){loseLife();player.x=60;player.y=400;player.vy=0;}

  // Camera
  camera.x = Math.max(0,Math.min(player.x-350, 3200-800));

  // Animation frame
  if(player.vx!==0){player.frameT+=dt;if(player.frameT>0.15){player.frame=(player.frame+1)%4;player.frameT=0;}}
  else player.frame=0;
}

function checkCollisions(){
  // Falafels
  for(const f of falafels){
    if(!f.alive)continue;
    if(player.x+player.w>f.x&&player.x<f.x+f.w&&player.y+player.h>f.y&&player.y<f.y+f.h){
      f.alive=false; GS.falafelCount++;
      // Particle burst on falafel collect
      try { const scF = worldToScreen(f.x - camera.x + 8, f.y + 8); spawnParticles(scF.x, scF.y, '#ffd700'); } catch(e){}
      if(GS.falafelCount>=10&&!majorItem.visible){majorItem.visible=true;}
    }
  }

  // Major ingredient
  if(majorItem.visible&&majorItem.alive){
    if(player.x+player.w>majorItem.x&&player.x<majorItem.x+majorItem.w&&
       player.y+player.h>majorItem.y&&player.y<majorItem.y+majorItem.h){
      majorItem.alive=false;
      const type=INGREDIENT_MAP[GS.level-1];
      GS.ingredients[type]++;
      // Big particle burst for ingredient
      try {
        const scI = worldToScreen(majorItem.x - camera.x + 16, majorItem.y + 16);
        const ingColors = {Jameed:'#c8b560',Meat:'#e05040',Rice:'#ffffaa',Laban:'#aaeeff'};
        for(let b=0;b<3;b++) spawnParticles(scI.x, scI.y, ingColors[type]);
      } catch(e){}
    }
  }

  // Obstacles (stomp to kill, otherwise take damage)
  if(invulnTimer<=0){
    for(const o of obstacles){
      if(!o.alive)continue;
      if(player.x+player.w>o.x&&player.x<o.x+o.w&&player.y+player.h>o.y&&player.y<o.y+o.h){
        // Check if player is stomping (falling from above onto enemy head)
        if(player.vy>0 && player.y+player.h < o.y+o.h/2+5){
          o.alive=false; // Kill enemy!
          player.vy=-350; // Bounce up
          GS.falafelCount = Math.min(GS.falafelCount+1, 15); // Bonus falafel
        } else {
          loseLife();
          invulnTimer=1.5;
          player.vy=-300;
          player.vx=player.facing*-200;
        }
        break;
      }
    }
  }

  // Laser collisions
  if(invulnTimer<=0){
    for(const l of lasers){
      if(player.x+player.w>l.x&&player.x<l.x+l.w&&player.y+player.h>l.y&&player.y<l.y+l.h){
        loseLife(); invulnTimer=1.5;
        player.vy=-250;
        break;
      }
    }
  }

  // Door
  if(player.x+player.w>door.x&&player.x<door.x+door.w&&player.y+player.h>door.y&&player.y<door.y+door.h){
    GS.level++;
    if(GS.level>16){winGame();return;}
    GS.falafelCount=0; GS.starvingTriggered=false;
    GS.lives=3; // استعادة الأرواح كل مرحلة
    buildLevel();
  }
}

function loseLife(){
  GS.lives--;
  if(GS.lives<=0){gameOver();return;}
  if(GS.lives===1&&!GS.starvingTriggered){GS.starvingTriggered=true;}
}

function updateObstacles(dt){
  for(const o of obstacles){
    if(!o.alive)continue;
    o.x+=o.vx;
    if(o.x<100||o.x>3100)o.vx*=-1;
    // Shooting logic
    if(o.shoots){
      o.shootTimer-=dt;
      if(o.shootTimer<=0){
        o.shootTimer=4+Math.random()*1.5;
        const dir = player.x > o.x ? 1 : -1;
        lasers.push({x:o.x+15,y:o.y+10,w:20,h:4,vx:dir*400,life:2});
      }
    }
  }
  // Update lasers
  for(let i=lasers.length-1;i>=0;i--){
    lasers[i].x+=lasers[i].vx*dt;
    lasers[i].life-=dt;
    if(lasers[i].life<=0||lasers[i].x<0||lasers[i].x>3200) lasers.splice(i,1);
  }
  // Animate lava bubbles
  for(const pit of lavaPits){
    for(const b of pit.bubbles){
      b.ry-=b.sp*dt;
      if(b.ry<0){b.ry=1;b.rx=Math.random();}
    }
  }
  // Move platforms
  for(const p of platforms){
    if(!p.moving)continue;
    p.x+=p.vx*dt;
    if(Math.abs(p.x-p.originX)>p.range) p.vx*=-1;
  }
}

// ========== DRAW ==========
function drawBG(){
  const zone = Math.floor((GS.level-1)/4);
  Assets.drawParallax(ctx, zone, camera.x, 800, 600);
}

function updateHUD(){
  const falafelWrap = document.getElementById('hudFalafelWrap');
  const falafelText = document.getElementById('hudFalafel');
  falafelText.textContent = `${GS.falafelCount}/10`;
  falafelWrap.classList.toggle('complete', GS.falafelCount >= 10);

  const livesEl = document.getElementById('hudLives');
  for(let i=0;i<3;i++){
    const c = livesEl.children[i];
    const lctx = c.getContext('2d');
    lctx.clearRect(0,0,16,16);
    lctx.drawImage(i < GS.lives ? Assets.icons.heart : Assets.icons.heartEmpty, 0, 0, 16, 16);
  }

  document.getElementById('hudLevel').textContent = `مرحلة ${GS.level}/16`;

  for(const span of document.getElementById('hudIngredients').children){
    const k = span.dataset.ing;
    const v = GS.ingredients[k];
    span.textContent = `${INGREDIENT_NAMES[k]}: ${v}/4`;
    span.classList.toggle('done', v >= 4);
  }
}

function drawSpeechBubble(){
  if(!GS.starvingTriggered || GS.lives !== 1) return;
  GS.bubbleAlpha+=GS.bubbleDir*0.03;
  if(GS.bubbleAlpha>1)GS.bubbleDir=-1;
  if(GS.bubbleAlpha<0.4)GS.bubbleDir=1;

  const bx=player.x-camera.x, by=player.y-50;
  ctx.globalAlpha=GS.bubbleAlpha;
  ctx.fillStyle='#fffdd0';
  ctx.strokeStyle='#e94560'; ctx.lineWidth=2;
  const tw=200;
  ctx.beginPath();
  ctx.roundRect(bx-tw/2,by-30,tw,28,8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#000'; ctx.font='bold 13px Cairo'; ctx.textAlign='center';
  ctx.fillText('يزم علامك ودنا نتغدا!',bx,by-10);
  ctx.globalAlpha=1;
}

function draw(){
  ctx.clearRect(0,0,800,600);
  drawBG();

  const cx=camera.x;

  // Lava pits (draw before ground so they appear in gaps)
  for(const pit of lavaPits) drawLavaPit(pit);

  // Platforms
  for(const p of platforms){
    const px=p.x-cx;
    if(px>-200&&px<1000){
      if(p.passThru){
        drawTilesRect(px, p.y, p.w, p.h, Assets.tiles.platform, true);
      } else {
        let sx=p.x, sw=p.w;
        for(const pit of lavaPits){
          if(sx<pit.x && sx+sw>pit.x){
            drawTilesRect(sx-cx, p.y, pit.x-sx, p.h, Assets.tiles.ground, false);
            const endPit=pit.x+pit.w;
            if(sx+sw>endPit){
              drawTilesRect(endPit-cx, p.y, sx+sw-endPit, p.h, Assets.tiles.ground, false);
            }
            sx=pit.x+pit.w; sw=p.x+p.w-sx;
          }
        }
        if(sw>0) drawTilesRect(sx-cx, p.y, sw, p.h, Assets.tiles.ground, false);
      }
    }
  }

  // Falafels
  for(const f of falafels){if(f.alive)drawFalafel(f.x-cx,f.y);}

  // Major Item
  if(majorItem.visible&&majorItem.alive){
    drawIngredient(majorItem.x-cx,majorItem.y,INGREDIENT_MAP[GS.level-1]);
  }

  // Door
  ctx.drawImage(Assets.door, door.x-cx, door.y, door.w, door.h);

  // Obstacles & Lasers
  for(const o of obstacles)drawObstacle(o);
  for(const l of lasers)drawLaser(l);

  // Player
  const starving=GS.starvingTriggered&&GS.lives===1;
  const px=player.x-cx, py=player.y;

  if(invulnTimer>0&&Math.floor(invulnTimer*10)%2===0){
    ctx.globalAlpha=0.3;
  }

  ctx.save();
  Assets.drawPlayer(ctx, px, py, player.frame, starving, player.facing);
  ctx.restore();
  ctx.globalAlpha=1;

  updateHUD();
  drawSpeechBubble();
}

// ========== GAME LOOP ==========
let lastTime=0;
function gameLoop(ts){
  if(!GS.running){return;}
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;

  try {
    updatePlayer(dt);
    updateObstacles(dt);
    if(invulnTimer>0)invulnTimer-=dt;
    checkCollisions();
    draw();
  } catch(err) {
    // Show error on canvas for debugging
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,800,600);
    ctx.fillStyle='#e94560';
    ctx.font='bold 16px Cairo';
    ctx.textAlign='left';
    ctx.fillText('JS ERROR: ' + err.message, 10, 30);
    ctx.fillStyle='#fff';
    ctx.font='12px monospace';
    const lines = (err.stack||'').split('\n');
    lines.forEach((l,i) => ctx.fillText(l.slice(0,90), 10, 55 + i*18));
    GS.running = false;
    return;
  }

  requestAnimationFrame(gameLoop);
}

// ========== SCREENS ==========
function showScreen(id){
  const screens = ['startScreen','gameOverScreen','winScreen'];
  const apply = () => {
    screens.forEach(s => document.getElementById(s).classList.add('hidden'));
    if(id) document.getElementById(id).classList.remove('hidden');
    hudEl.classList.toggle('hidden', id !== null);
  };
  if(document.startViewTransition) document.startViewTransition(apply);
  else apply();
}

function startGame(){
  showScreen(null);
  resetGS();
  GS.running=true;
  buildLevel();
  updateHUD();
  lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}

function gameOver(){
  GS.running=false;
  const lvlEl = document.getElementById('goLevel');
  lvlEl.innerHTML = `وصلت مرحلة <strong style="color:#ffd700">${GS.level}</strong> من 16`;
  showScreen('gameOverScreen');
}

function winGame(){
  GS.running=false;
  // Update win stats display
  document.getElementById('statJameed').textContent = `${GS.ingredients.Jameed}/4`;
  document.getElementById('statMeat').textContent   = `${GS.ingredients.Meat}/4`;
  document.getElementById('statRice').textContent   = `${GS.ingredients.Rice}/4`;
  document.getElementById('statLaban').textContent  = `${GS.ingredients.Laban}/4`;
  showScreen('winScreen');
  // Confetti burst!
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      spawnParticles(
        Math.random()*window.innerWidth,
        Math.random()*window.innerHeight*0.5,
        ['#ffd700','#ff6b80','#aaffaa','#80cfff','#ffaa00'][Math.floor(Math.random()*5)]
      );
    }, i*200);
  }
}
